plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34

    // The animal drawings, their shows and the now-playing views (ink/), shared with the Today add-on, which ships the assets.
    sourceSets.main.java.srcDirs += rootProject.file('../ink/src/main/java')

    defaultConfig {
        // Opt-in identity for firmware with a package-name HOME allowlist; see docs/devices/xiaomi-mitv-aetp0-dofus.md.
        applicationId providers.gradleProperty('launcherApplicationId').getOrElse('com.gathin.tvhome')
        minSdk 26
        targetSdk 34
        versionCode 9
        versionName '3.0-ink'
    }

    buildTypes {
        release {
            // R8 strips and optimises the code: smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded over ADB, never published: sign with the debug key so it installs over a debug build.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // No runtime dependencies: plain Android. Test only (never in the APK): plain JVM tests, src/test.
    testImplementation 'junit:junit:4.13.2'
}
